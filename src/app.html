<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			try {
				var saved = localStorage.getItem('cafe-theme');
				var valid = ['kanagawa', 'glass-cafe', 'neurobrutalism', 'dribbble'];
				document.documentElement.setAttribute(
					'data-theme',
					valid.indexOf(saved) !== -1 ? saved : 'neurobrutalism'
				);
			} catch (e) {
				document.documentElement.setAttribute('data-theme', 'neurobrutalism');
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
