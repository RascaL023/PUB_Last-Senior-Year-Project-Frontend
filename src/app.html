<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@700;800&family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Shippori+Mincho+B1:wght@600;700;800&display=swap"
			rel="stylesheet"
		/>
		<script>
			try {
				var saved = localStorage.getItem('cafe-theme');
				var valid = ['kanagawa', 'glass-cafe', 'neurobrutalism', 'dribbble'];
				document.documentElement.setAttribute(
					'data-theme',
					valid.indexOf(saved) !== -1 ? saved : 'neurobrutalism'
				);
			} catch (e) {
				document.documentElement.setAttribute('data-theme', 'neurobrutalism');
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
